<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 18px 10px;
      }
      .title {
        font-weight: 600;
        font-size: 15px;
        white-space: nowrap;
      }
      .count {
        font-size: 12px;
        color: var(--oc-muted, inherit);
        white-space: nowrap;
      }
      .spacer {
        flex: 1 1 auto;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 0 18px 10px;
      }
      .tabs[hidden] {
        display: none;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        padding: 5px 6px 5px 10px;
        border: 1px solid var(--oc-border, transparent);
        border-radius: 8px;
        background: none;
        color: var(--oc-muted, inherit);
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab:hover {
        background: var(--oc-hover, transparent);
      }
      .tab.active {
        color: var(--oc-fg, inherit);
        border-color: var(--oc-primary, currentColor);
      }
      .tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-dirty {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: var(--oc-warning, currentColor);
      }
      .tab-close {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: inherit;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .tab-close:hover {
        background: var(--oc-active, transparent);
      }
      .nbody {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 12px;
        padding: 0 18px 24px;
      }
      .left {
        flex: 0 0 264px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .left[hidden] {
        display: none;
      }
      .left-head {
        flex: 0 0 auto;
      }
      .left-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .note-row {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      .note-row:hover {
        background: var(--oc-hover, transparent);
      }
      .note-row.active {
        border-color: var(--oc-primary, currentColor);
      }
      .note-row-title {
        font-size: 12.5px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 12px;
      }
      .note-row-sub {
        font-size: 11px;
        color: var(--oc-muted, inherit);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .draft-dot {
        position: absolute;
        top: 10px;
        right: 8px;
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: var(--oc-warning, currentColor);
      }
      .left-empty {
        padding: 12px 8px;
        font-size: 12px;
        color: var(--oc-muted, inherit);
      }
      .right {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--oc-border, transparent);
        border-radius: 10px;
        padding: 14px;
      }
      .right[hidden] {
        display: none;
      }
      .viewer-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .viewer-title {
        font-weight: 600;
        font-size: 14px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .viewer-title a {
        color: inherit;
        text-decoration: none;
      }
      .viewer-title a:hover {
        text-decoration: underline;
      }
      .viewer-actions {
        display: inline-flex;
        gap: 6px;
        margin-left: auto;
        flex: 0 0 auto;
      }
      .viewer-meta {
        font-size: 12px;
        color: var(--oc-muted, inherit);
        margin: 2px 0 10px;
      }
      .viewer-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .viewer-empty {
        padding: 24px 8px;
        text-align: center;
        font-size: 12.5px;
        color: var(--oc-muted, inherit);
      }
      .loading-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .md {
        font-size: 13px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4 {
        margin: 1em 0 0.35em;
        line-height: 1.3;
        font-size: 1.08em;
      }
      .md h1 {
        font-size: 1.35em;
      }
      .md h2 {
        font-size: 1.2em;
      }
      .md p {
        margin: 0.5em 0;
      }
      .md ul,
      .md ol {
        margin: 0.5em 0;
        padding-left: 1.4em;
      }
      .md li {
        margin: 0.15em 0;
      }
      .md code {
        font-family: var(--oc-mono, monospace);
        font-size: 0.92em;
        background: var(--oc-hover, transparent);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      .md pre {
        background: var(--oc-hover, transparent);
        padding: 10px;
        border-radius: 8px;
        overflow: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
      }
      .md blockquote {
        margin: 0.6em 0;
        padding: 0.1em 0.9em;
        border-left: 3px solid var(--oc-border, currentColor);
        color: var(--oc-muted, inherit);
      }
      .md a {
        color: var(--oc-primary, inherit);
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--oc-border, currentColor);
        margin: 1em 0;
      }
      .md table {
        border-collapse: collapse;
      }
      .md th,
      .md td {
        border: 1px solid var(--oc-border, currentColor);
        padding: 4px 8px;
      }
      .md img {
        max-width: 100%;
      }
      .editor {
        border: 1px solid var(--oc-border, transparent);
        border-radius: 8px;
        overflow: hidden;
      }
      .editor .cm-editor {
        height: 100%;
        max-height: 60vh;
      }
      .editor .cm-scroller {
        overflow: auto;
      }
      @media (max-width: 700px) {
        .nbody {
          flex-direction: column;
        }
        .left {
          flex: 0 0 auto;
          max-height: 40%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="notes.js"></script>
  </body>
</html>
